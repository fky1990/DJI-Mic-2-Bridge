name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Verify signature and architectures
        run: |
          codesign --verify --deep --strict "build/DJI Mic 2 Bridge.app"
          file "build/DJI Mic 2 Bridge.app/Contents/MacOS/DJIMicBridge"
      - name: Package app
        run: ditto -c -k --keepParent "build/DJI Mic 2 Bridge.app" DJI-Mic-2-Bridge-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DJI-Mic-2-Bridge-macOS
          path: DJI-Mic-2-Bridge-macOS.zip
